# Dependabot 設定 (PR feat/security-auto-update / 2026-05-09, 自動マージ化 2026-06-04)
# クレジット最適化 2026-06-13: daily→weekly + all-others キャッチオール追加でデプロイ数を削減
#
# 目的: ライブラリ / アクションのバージョンを常時最新化し、既知脆弱性 (CVE) の取りこぼしを防ぐ。
#   github-actions / npm を週次で検知 → PR 起票し、patch / minor は
#   .github/workflows/dependabot-auto-merge.yml が CI green を条件に自動マージする。
#   major (破壊的変更を含みうる) は自動マージ対象外で、人間が手動レビューする。
#
# 公式ドキュメント:
#   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# 更新スコープ:
#   - github-actions: 週次月曜 (1PR/週にグループ集約)
#   - npm: 週次月曜 (機能グループ + キャッチオールで最大5PR/週に抑制。patch/minor は自動マージ、major は手動)
#
# デプロイ数見積もり (変更前: ~84回/月 → 変更後: ~20回/月):
#   github-actions: 1PR/週, npm: next-react/prisma/testing/all-others の最大4PR/週

version: 2

updates:
  # ────────────────────────────────────────────────
  # GitHub Actions: 週次でアクションバージョンを自動更新 (全アクションを1PRに集約)
  #   gitleaks-action / codeql-action / pnpm/action-setup / actions/setup-node 等が対象
  #   これにより gitleaks 等の「アクションにバンドルされた検出ルール」が常に最新化される
  # ────────────────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Asia/Tokyo'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(actions)'
    open-pull-requests-limit: 3
    groups:
      github-actions-all:
        patterns:
          - '*'

  # ────────────────────────────────────────────────
  # npm: 週次で全依存を更新 (機能グループ + キャッチオールで PR 数を最小化)
  #   patch/minor は自動マージされるため PR が滞留しない。major のみ手動レビューで残る。
  # ────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Asia/Tokyo'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 5
    ignore:
      # pdf-parse v2 は破壊的変更 (v1 の `pdf(buffer)→{text}` 廃止 →
      #   `new PDFParse({ data }).getText()`)。src/services/file-text-extraction.service.ts が
      #   v1 API 前提のため major 自動更新を抑止。v1.1.4 に既知脆弱性なし (2026-06-04 確認)。
      #   v2 へ上げる場合はコード移行 + 実 PDF 結合テスト + Netlify standalone 検証が必要 (#500 参照)。
      - dependency-name: 'pdf-parse'
        update-types: ['version-update:semver-major']
      # stripe は課金コア (severity-1 請求 invariant)。v17→22 は5メジャー飛ばしで破壊的変更を
      #   多数含み、src/lib/stripe.ts は apiVersion を `as unknown as` でキャストするため
      #   型不一致を tsc で検知できず請求の実行時バグ化リスクがある。v17.7.0 に既知脆弱性なし
      #   (2026-06-04 確認)。major 移行は専用の検証タスク (changelog 精査 + 課金フロー検証) で行う (#505 参照)。
      - dependency-name: 'stripe'
        update-types: ['version-update:semver-major']
    groups:
      # Next.js / React など同時更新したい関連パッケージはグループ化して PR 数を抑制
      next-react:
        patterns:
          - 'next'
          - 'next-*'
          - 'react'
          - 'react-*'
          - '@types/react*'
      prisma:
        patterns:
          - '@prisma/*'
          - 'prisma'
      testing:
        patterns:
          - 'vitest*'
          - '@vitest/*'
          - '@playwright/*'
          - 'playwright'
      # 上記グループに属さない全パッケージを1PRに集約 (eslint/prettier/supabase/@types/* 等)
      all-others:
        patterns:
          - '*'
