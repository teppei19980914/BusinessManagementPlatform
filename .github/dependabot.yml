# Dependabot 設定 (PR feat/security-auto-update / 2026-05-09, 自動マージ化 2026-06-04)
#
# 目的: ライブラリ / アクションのバージョンを常時最新化し、既知脆弱性 (CVE) の取りこぼしを防ぐ。
#   github-actions / npm を日次で検知 → PR 起票し、patch / minor は
#   .github/workflows/dependabot-auto-merge.yml が CI green を条件に自動マージする。
#   major (破壊的変更を含みうる) は自動マージ対象外で、人間が手動レビューする。
#
# 公式ドキュメント:
#   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# 更新スコープ:
#   - github-actions: 日次 (新しい脆弱性検出ルールをすぐに取り込む)
#   - npm: 日次 (新バージョンを随時 PR 化。patch/minor は自動マージ、major は手動)
#   - npm (security only): 即時 PR (ライブラリの CVE 公表時に自動 PR)

version: 2

updates:
  # ────────────────────────────────────────────────
  # GitHub Actions: 日次でアクションバージョンを自動更新
  #   gitleaks-action / codeql-action / pnpm/action-setup / actions/setup-node 等が対象
  #   これにより gitleaks 等の「アクションにバンドルされた検出ルール」が常に最新化される
  # ────────────────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '03:00'
      timezone: 'Asia/Tokyo'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(actions)'
    open-pull-requests-limit: 5
    # patch / minor は dependabot-auto-merge.yml が CI green を条件に自動マージする。
    # メジャーアップデートは破壊的変更を含むことがあるため自動マージ対象外 (手動レビュー)。

  # ────────────────────────────────────────────────
  # npm: 日次で全依存を更新 (新バージョンを随時 PR 化)
  #   patch/minor は自動マージされるため PR が滞留しない。major のみ手動レビューで残る。
  # ────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      # NOTE: `schedule.day` は `interval: weekly` でのみ valid (公式 schema 制約)。
      #   daily / monthly では day を指定しない (指定すると validator が fail する)。
      interval: 'daily'
      time: '03:00'
      timezone: 'Asia/Tokyo'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 10
    # ignore: ここで pin したいパッケージがあれば追加 (現状なし)
    groups:
      # Next.js / React など同時更新したい関連パッケージはグループ化して PR 数を抑制
      next-react:
        patterns:
          - 'next'
          - 'next-*'
          - 'react'
          - 'react-*'
          - '@types/react*'
      prisma:
        patterns:
          - '@prisma/*'
          - 'prisma'
      testing:
        patterns:
          - 'vitest*'
          - '@vitest/*'
          - '@playwright/*'
          - 'playwright'
