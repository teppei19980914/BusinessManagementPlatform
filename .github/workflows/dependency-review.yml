# Dependency Review (GitHub 公式 action)
# https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review
#
# 役割:
#   PR で追加・更新された依存パッケージに既知脆弱性・不適切ライセンスがないかを
#   GitHub Advisory Database と照合して PR 上にコメント+fail する。
#
#   security.yml の pnpm audit がリポジトリ全体をスキャンするのに対し、
#   本 workflow は **PR で入る差分のみ** を厳密にチェックする (早期検知)。
#
# トリガ: pull_request (main 対象)
#
# 関連:
#   - .github/workflows/security.yml — リポジトリ全体スキャン (daily)
#   - SECURITY.md — 脆弱性対応方針

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          # 脆弱性レベル: high 以上で fail (low/moderate は警告のみ)
          fail-on-severity: high
          # ライセンスポリシー (strong copyleft / 商用 SaaS 非互換)
          # 2026-05-13 (security/config-hardening, L-8): dependency-reviewer agent 監査で
          #   deny-licenses 未設定が指摘された。AGPL/SSPL/BUSL 等の新規依存が PR で
          #   混入する経路を即時 block する。
          #   既存依存に dual-license (e.g. jszip MIT OR GPL-3.0) があるが、
          #   dependency-review-action は dual-license の場合に MIT 側を採用するため
          #   GPL-3.0 でも本ポリシーで block されない (false positive なし)。
          deny-licenses: GPL-2.0, GPL-2.0-only, GPL-3.0, GPL-3.0-only, AGPL-1.0, AGPL-1.0-only, AGPL-3.0, AGPL-3.0-only, SSPL-1.0, BUSL-1.1
          comment-summary-in-pr: on-failure
