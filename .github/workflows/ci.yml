# メイン CI ワークフロー (PR #82 で有効化 / PR #83 でカバレッジ統合):
#
#   PR / push 時に lint / test / build を自動実行する。
#   Stop hook (ローカル) と同等のチェックを GitHub 側でも回し、
#   ローカルで pnpm を実行し忘れた状態でマージされるのを防ぐ。
#
# 実行内容:
#   1. ESLint (pnpm lint)
#   2. Vitest 単体テスト + カバレッジ計測 (pnpm test --coverage)
#   3. PR コメントへカバレッジ要約を投稿 (davelosert/vitest-coverage-report-action)
#   4. Next.js ビルド (pnpm build)
#
# 設計判断:
#   - Node.js 22 LTS を使用 (README.md と整合)
#   - pnpm 10 を使用 (package.json の packageManager 指定なしのため latest 安定版)
#   - キャッシュ: pnpm store + .next/cache を保存し再ビルドを高速化
#   - カバレッジは v8 プロバイダ (vitest.config.ts) + json-summary + json を出力
#     し、action が PR コメントとして整形投稿する (外部サービス不要)。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # PR #83: davelosert/vitest-coverage-report-action が PR コメントを投稿するため必要。
  #         push (main) 時は PR が存在しないので no-op になる。
  pull-requests: write

jobs:
  ci:
    name: Lint / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: E2E coverage manifest check (PR #90)
        # docs/test/E2E_COVERAGE.md に未記載の新規 page.tsx / route.ts を検出して fail。
        # E2E 範囲の横展開漏れを構造的に防止する。
        run: pnpm e2e:coverage-check

      - name: Banned auth patterns check (fix/session-clearance / PR #415)
        # NextAuth 既定 signOut の Set-Cookie 脱落で誤ユーザログイン事故が起きた
        # 経緯から、`signOut` import / `/api/auth/signout` 直接 fetch /
        # Server Component の `await auth()` 直接呼出を CI で機械的に検出する。
        # 退行 (= 新規開発者が「ふつうの signOut でいいでしょ」と書く) を防止する。
        # 詳細: docs/knowledge/KDD_PATTERNS.md §5.X+84
        run: pnpm check:banned-auth-patterns

      - name: LLM billing bypass check (ADR-0019 / 2026-05-24)
        # ADR-0019 で課金エンジン (withMeteredLLM) 経由の設計を再確認した経緯から、
        # `getAnthropicClient()` / `voyageEmbed()` の直接呼出を allowlist 外で
        # 検出して CI を fail させる。バイパスすると ApiCallLog / Stripe queue /
        # rate limit / fair use limit のすべてを素通りするため事業継続性の根本的破綻。
        # 詳細: docs/adr/0019-billable-feature-units-and-free-tier-expansion.md §LLM 暴走防止
        run: pnpm check:llm-billing-bypass

      - name: FAQ embeddings sync check (★生命線★ ADR-0028 / 2026-05-30)
        # ADR-0028 (RAG 移行) の 4 層防御の Layer 1。
        # src/config/faq-content.ts / guide-content.ts の構造健全性 (id 重複 / 文字数超過 /
        # visibleTo 不正値 / Voyage MAX_INPUT_CHARS 超過 等) を機械的に検出。
        # 本ガードが PASS することは scripts/generate-faq-embeddings.ts が安全に走る
        # 前提条件。FAQ/Guide が肥大化しても deploy 後の embedding 生成が破綻しない。
        # 詳細: docs/knowledge/KDD_PATTERNS.md §5.X+193 / docs/developer-guide/FAQ_AND_OWL_CHAT_GUIDE.md §7
        run: pnpm check:faq-embeddings-sync

      - name: Test (vitest + coverage)
        # PR #83: --coverage で v8 プロバイダが coverage-final.json / coverage-summary.json
        # / lcov.info を coverage/ 配下に出力する。
        # 注意: テスト失敗でも後段のカバレッジコメントを表示したいので、
        # テスト失敗時の PR コメントは action 側が「カバレッジ未生成」と表示するだけで
        # ジョブは fail で止まる (pnpm test の exit code が伝播する)。
        run: pnpm test --coverage

      - name: Report coverage (PR comment)
        # PR コメントで「総計 / 変更ファイルのみ / 変更行カバレッジ」を可視化する。
        # 公式 action (https://github.com/davelosert/vitest-coverage-report-action)。
        # テスト失敗時 (前段 Test fail) でも可能な範囲でコメントを残したいので always()。
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Build (next build)
        # ビルド時は実 DB 接続不要 (next build は static analysis 中心)。
        # DATABASE_URL ダミー値で十分通る (Netlify build と同じパターン)。
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          DIRECT_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          NEXTAUTH_SECRET: 'ci_dummy_secret_for_build_only_not_for_production'
        run: pnpm build
